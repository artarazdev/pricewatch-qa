# SDD Configuration — PriceWatch-QA
schema: spec-driven

context: |
  Tech stack: TypeScript (ES2022, NodeNext), Playwright 1.62+
  Architecture: Store Adapter pattern (Amazon Spain as first adapter)
  Testing: Playwright for unit/integration/E2E, no coverage tool detected
  Style: Strict TypeScript, ESLint, Prettier, conventional commits

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (Store Adapter)
    - tdd: true
    - test_command: "npm test"
  verify:
    - test_command: "npm test"
    - build_command: "npm run build"
    - coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner: playwright
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: false
